<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ed"><title>Mon compte — Wave Skincare</title><link rel="stylesheet" href="styles.css"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>
.account-wrap{max-width:560px;margin:50px auto;padding:24px}.account-card{background:#fff;border:1px solid #eadfce;border-radius:18px;padding:28px;box-shadow:0 12px 35px #3d2b1510}.account-card h1{font-family:'Playfair Display',serif}.account-card label{display:block;margin:14px 0;font-weight:600}.account-card input{display:block;width:100%;padding:13px;margin-top:7px;border:1px solid #d9cbb8;border-radius:9px;font:inherit}.password-wrap{display:flex;align-items:center;position:relative;margin-top:7px}.password-wrap input{flex:1;min-width:0;margin:0;padding-right:54px}.password-toggle{position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;padding:8px;cursor:pointer;color:#594b3d;font-size:20px;line-height:1}.password-toggle:focus-visible{outline:2px solid #9a7544;outline-offset:2px;border-radius:6px}.account-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.account-actions button{flex:1;min-width:140px}.account-msg{margin-top:16px;padding:12px;border-radius:9px;background:#f8f1e6;white-space:pre-wrap}.muted{color:#766d62;font-size:.92rem}#logoutBtn[hidden]{display:none!important}
</style></head><body>
<div class="announcement">Wave Skincare <span>✦</span> Votre espace personnel</div>
<header class="site-header"><a class="logo" href="index.html"><span class="logo-wave">〰</span><span>Wave</span><small>SKINCARE</small></a><nav class="main-nav"><a href="index.html">Accueil</a><a href="boutique.html">Boutique</a><a href="contact.html">Contact</a></nav></header>
<main class="account-wrap"><section class="account-card"><p class="eyebrow">ESPACE CLIENT</p><h1>Bienvenue chez <em>Wave.</em></h1><p class="muted">Créez votre compte ou connectez-vous pour accéder à votre espace.</p>
<form id="authForm"><label>Adresse e-mail<input id="email" type="email" autocomplete="email" required></label><label for="password">Mot de passe<div class="password-wrap"><input id="password" type="password" minlength="6" autocomplete="current-password" required><button class="password-toggle" id="togglePassword" type="button" aria-label="Afficher le mot de passe" aria-pressed="false" title="Afficher le mot de passe">👁</button></div></label>
<div class="account-actions"><button class="btn btn-dark" id="loginBtn" type="button">Se connecter</button><button class="btn btn-gold" id="signupBtn" type="button">Créer un compte</button></div></form>
<div id="authMessage" class="account-msg" role="status">Chargement de la connexion sécurisée…</div><div class="account-actions"><button class="btn btn-dark" id="logoutBtn" type="button" hidden>Se déconnecter</button><a class="btn btn-gold" href="boutique.html">Retour à la boutique</a></div>
</section></main><script src="supabase-config.js"></script><script type="module" src="auth.js"></script><script>
document.getElementById("togglePassword").addEventListener("click",function(){const field=document.getElementById("password");const showing=field.type==="password";field.type=showing?"text":"password";this.textContent=showing?"🙈":"👁";this.setAttribute("aria-label",showing?"Masquer le mot de passe":"Afficher le mot de passe");this.setAttribute("title",showing?"Masquer le mot de passe":"Afficher le mot de passe");this.setAttribute("aria-pressed",String(showing));});
</script></body></html>
