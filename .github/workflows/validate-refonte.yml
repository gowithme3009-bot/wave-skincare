name: Validate Wave interface redesign

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate interface and JavaScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check products.js
          node --check contact.js
          node --input-type=module --check < auth.js
          node --input-type=module --check < admin.js
          node --input-type=module --check < checkout.js
      - name: Check redesign assets and routes
        run: |
          test -s wave-experience.css
          grep -q 'customer-page' compte.html
          grep -q 'admin-page' admin.html
          grep -q 'compte.html?view=orders' checkout.js
          grep -q 'boutique.html?welcome=1' auth.js
