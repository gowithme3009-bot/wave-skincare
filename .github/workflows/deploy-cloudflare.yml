name: Deploy Wave Skincare to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: wave-skincare-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check products.js
          node --check contact.js
          node --input-type=module --check < auth.js
          node --input-type=module --check < admin.js
          node --input-type=module --check < checkout.js

      - name: Prepare static site
        run: |
          mkdir -p dist
          git archive HEAD | tar -x -C dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wave-skincare --branch=main
